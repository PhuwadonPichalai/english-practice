<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordUp — ฝึกศัพท์ภาษาอังกฤษ</title>
  <meta name="description" content="ฝึกคำศัพท์ภาษาอังกฤษ ระดับ A1–C1 หลายโหมด: แฟลชการ์ด เลือกคำแปล พิมพ์สะกด ฟังเสียง เติมคำ" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FFE45C'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23202124' font-family='serif' font-weight='700'>W</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=202611222331" />
  <script>
    // ตั้งธีมก่อนหน้าโหลด เพื่อไม่ให้จอกะพริบ
    (function () {
      var t = null;
      try { t = localStorage.getItem("wu-theme"); } catch (e) {}
      if (!t || t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="หน้าแรก">
      <span class="brand-mark">W</span><span class="brand-name">WordUp</span>
    </button>
    <nav class="topnav">
      <button class="navlink" data-go="home">หน้าแรก</button>
      <button class="navlink" data-go="practice">ฝึก</button>
      <button class="navlink" data-go="library">คลังคำ</button>
      <button class="navlink" data-go="progress">ความสำเร็จ</button>
      <button class="acct" id="accountBtn" data-go="account" aria-label="บัญชีและการตั้งค่า"></button>
      <button class="hud" id="hud" data-go="progress" aria-label="เลเวลและ XP"></button>
      <button class="icon-btn" id="soundToggle" aria-label="เปิด/ปิดเสียงเอฟเฟกต์" title="เปิด/ปิดเสียงเอฟเฟกต์">
        <svg class="i-snd" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="i-mute" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="สลับโหมดมืด/สว่าง" title="สลับโหมดมืด/สว่าง">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <span>WordUp ฝึกศัพท์อังกฤษ ระดับ A1 ถึง C1</span><a href="https://github.com/PhuwadonPichalai/english-practice" target="_blank" rel="noopener">GitHub</a>
  </footer>


  <nav class="tabbar" aria-label="เมนูหลัก">
    <button class="tab" data-go="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>หน้าแรก</span></button>
    <button class="tab" data-go="practice"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg><span>ฝึก</span></button>
    <button class="tab" data-go="library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19"/></svg><span>คลังคำ</span></button>
    <button class="tab" data-go="progress"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="m8.5 13.5-1.5 8 5-3 5 3-1.5-8"/></svg><span>ความสำเร็จ</span></button>
  </nav>
  <script src="firebase-config.js?v=202611222331"></script>
  <script src="data/a1.js?v=202611222331"></script>
  <script src="data/a2.js?v=202611222331"></script>
  <script src="data/b1.js?v=202611222331"></script>
  <script src="data/b2.js?v=202611222331"></script>
  <script src="data/c1.js?v=202611222331"></script>
  <script src="app.js?v=202611222331"></script>
  <script type="module" src="cloud.js?v=202611222331"></script>
</body>
</html>
